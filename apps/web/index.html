<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Horror Tube · Live</title>
    <link rel="icon" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="ht.css" />
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--soot);
        overscroll-behavior: none;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        mask-image: radial-gradient(ellipse at 50% 45%, black 55%, var(--shade));
        cursor: none;
        touch-action: none;
      }
      #view[data-cursor="press"] {
        cursor:
          url(assets/cursor-press.svg) 12 2,
          pointer;
      }
      .gaze {
        position: fixed;
        z-index: 6;
        left: 50%;
        top: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        pointer-events: none;
        background: var(--bone);
        opacity: 0.6;
        box-shadow: 0 0 0 1px var(--soot);
      }
      .gaze[data-away="1"] {
        background: var(--blood);
        opacity: 1;
      }
      .demo {
        position: fixed;
        z-index: 10;
        left: 24px;
        top: 20px;
        display: flex;
        gap: 16px;
      }
      .demo button {
        font: 400 12px/1 var(--f-osd);
        color: var(--grime);
        letter-spacing: 0.06em;
      }
      .demo button:hover {
        color: var(--rust);
      }
      .demo.sound {
        left: auto;
        right: 24px;
      }
      .dread {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        opacity: 0;
        transition: opacity 80ms linear;
        background: radial-gradient(
          ellipse at 50% 45%,
          transparent 35%,
          rgb(134 16 26 / 0.55) 75%,
          rgb(12 8 6 / 0.95)
        );
      }
      .cut {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: var(--soot);
      }
      .scare {
        position: fixed;
        inset: 0;
        z-index: 21;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        image-rendering: pixelated;
      }
      .cut,
      .scare {
        cursor: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="gaze" class="gaze" aria-hidden="true"></div>
    <div id="dread" class="dread" aria-hidden="true"></div>
    <p class="demo sound"><button id="mute">SOUND ON</button></p>
    <div id="cut" class="cut" hidden></div>
    <canvas id="scare" class="scare" hidden aria-hidden="true"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
